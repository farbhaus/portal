openapi: 3.0.3
info:
  title: Portal API
  version: "0.1.0"
  description: |
    Portal's admin REST API. The web app uses the same endpoints.

    Authenticate either with the `portal_session` cookie from `POST /api/auth/login`, or with
    `Authorization: Bearer <PORTAL_API_TOKEN>` when the server sets `PORTAL_API_TOKEN`. The token
    can't change how the admin signs in (password, two-factor and passkey routes answer 403 to it),
    every write it makes is recorded in the admin log as `api_token.used`, and wrong tokens are
    locked out per client IP (429).

    This document covers the stable admin resources. The SvelteKit web build's network calls are
    the reference for any field not listed here.
servers:
  - url: https://portal.example.com
    description: Your Portal base URL (BASE_URL)
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /api/health:
    get:
      summary: Health check
      security: []
      responses:
        "200":
          description: Service, database and Redis status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  db: { type: boolean }
                  redis: { type: boolean }
                  version: { type: string }
  /api/auth/login:
    post:
      summary: Password login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Logged in (sets portal_session), or a TOTP challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  totp_required: { type: boolean }
                  id: { type: string, nullable: true }
                  email: { type: string, nullable: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/logout:
    post:
      summary: Log out
      responses:
        "204": { description: Logged out }
  /api/auth/me:
    get:
      summary: Current admin
      responses:
        "200":
          description: Current admin
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  email: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/upload-links:
    get:
      summary: List upload links
      responses:
        "200":
          description: Upload links
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UploadLink" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      summary: Create an upload link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadLinkCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
        "409":
          description: Frame.io is not connected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /api/upload-links/{link_id}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      summary: Read an upload link
      responses:
        "200":
          description: Upload link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      summary: Update an upload link
      description: Only keys present in the body are applied. A `folder` without a `sync` key keeps the stored sync; `sync` null removes it, and the link's `turbosort` with it unless the body sets one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadLinkUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      summary: Delete an upload link
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/upload-links/{link_id}/revoke:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      summary: Revoke an upload link
      responses:
        "200":
          description: Revoked
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
  /api/upload-links/{link_id}/restore:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    post:
      summary: Restore a revoked upload link
      responses:
        "200":
          description: Restored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadLink" }
  /api/settings/fiotransfer:
    get:
      summary: The Imports and Exports folder names synced links start with
      responses:
        "200":
          description: The names in use (Settings, else the defaults)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiotransferNames" }
    post:
      summary: Set the Imports and Exports folder names
      description: An empty or missing name goes back to its default. Links keep the names they were saved with.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                imports_folder: { type: string, nullable: true }
                exports_folder: { type: string, nullable: true }
      responses:
        "200":
          description: The names now in use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FiotransferNames" }
        "422": { description: "Not one folder name each, or the same name twice" }
  /api/frameio/status:
    get:
      summary: Frame.io connection status
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connected: { type: boolean }
                  adobe_email: { type: string, nullable: true }
                  expires_at: { type: string, format: date-time, nullable: true }
                  needs_refresh: { type: boolean }
                  scopes: { type: string }
  /api/frameio/accounts:
    get:
      summary: List Frame.io accounts
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/frameio/workspaces:
    get:
      summary: List workspaces in an account
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/frameio/projects:
    get:
      summary: List projects in a workspace
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: workspace_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Projects
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/frameio/folders:
    get:
      summary: List subfolders
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: folder_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Folders
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/frameio/files:
    get:
      summary: List files in a folder
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: folder_id, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: Files
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/frameio/search:
    get:
      summary: Search projects and folders by name
      parameters:
        - { name: account_id, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200":
          description: Matches
          content:
            application/json:
              schema: { type: array, items: { type: object, additionalProperties: true } }
  /api/openapi.yaml:
    get:
      summary: This document
      security: []
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema: { type: string }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The server's PORTAL_API_TOKEN
    sessionCookie:
      type: apiKey
      in: cookie
      name: portal_session
  parameters:
    LinkId:
      name: link_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limited
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [detail]
      properties:
        detail: { type: string }
    Folder:
      type: object
      required: [type, account_id, folder_id]
      properties:
        type: { type: string, enum: [frameio] }
        account_id: { type: string }
        workspace_id: { type: string, nullable: true }
        project_id: { type: string, nullable: true }
        project_name: { type: string, nullable: true }
        folder_id: { type: string }
        folder_name: { type: string, nullable: true }
        path:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
        path_resolved_at: { type: string, format: date-time, nullable: true }
        sync:
          allOf: [{ $ref: "#/components/schemas/LinkSync" }]
          nullable: true
          description: Upload links only. On PATCH, a folder without this key keeps the stored block; null removes it.
    FiotransferNames:
      type: object
      properties:
        imports_folder: { type: string, example: 1_DRIVE }
        exports_folder: { type: string, example: 0_EXPORTS }
        defaults:
          type: object
          properties:
            imports_folder: { type: string }
            exports_folder: { type: string }
    LinkSync:
      type: object
      description: |
        "Sync this project's folders with FioTransfer" for an upload link. Portal only stores it;
        the FioTransfer client reads it from `GET /api/upload-links` and keeps the link's project
        folder (`turbosort`) on the user's machine with up to two one-way folders: Imports
        (`drive`) bring what the client sends down, Exports (`exports`) take what the user puts in
        theirs up to `exports.folder_id`. A lane that is absent is off; at least one is on. Nothing
        is ever deleted. Stored with `mode: add_only` always. Portal 2.2's `download`, `upload`,
        `name` and `{}` are accepted on input and stored in this shape (`name` as the link's
        `turbosort`, `{}` as Imports with its defaults); a lane comes under one of its names only.
      properties:
        mode: { type: string, enum: [add_only] }
        drive:
          allOf: [{ $ref: "#/components/schemas/LinkSyncLane" }]
          description: "Imports. `folder_id`: where they come down from (default: the link's own folder)."
        exports:
          allOf: [{ $ref: "#/components/schemas/LinkSyncLane" }]
          description: "Exports. `folder_id` (required): where they go up to; not the folder Imports come down from, nor inside it."
    LinkSyncLane:
      type: object
      properties:
        folder_id: { type: string, format: uuid, description: A Frame.io folder }
        local: { type: string, description: "The folder's name on disk, inside the project folder. Default: the Imports/Exports name from Settings (`/api/settings/fiotransfer`). One folder name of at most 255 bytes: no / \\ % or control characters, not . or ..; the two must differ, ignoring case." }
    UploadLinkCreate:
      type: object
      required: [folder]
      properties:
        name: { type: string, nullable: true }
        folder: { $ref: "#/components/schemas/Folder" }
        turbosort:
          type: string
          nullable: true
          description: The project folder on the user's machine that holds the link's Imports and Exports (one folder name). A synced link always has one; without it Portal uses the job folder the Imports sit in. Without a `sync`, FioTransfer mirrors it both ways.
        send_link: { type: boolean, default: true, description: Keep a Send link on the Exports folder for the client. }
        expires_at: { type: string, format: date-time, nullable: true }
        password: { type: string, nullable: true }
        verify_email: { type: boolean, default: false }
        max_file_size: { type: integer, nullable: true }
        allowed_extensions: { type: array, items: { type: string }, nullable: true }
        uploader_fields_required:
          type: object
          properties:
            name: { type: boolean }
            email: { type: boolean }
            message: { type: boolean }
        subfolder_template: { type: string, nullable: true }
        brand_display_name: { type: string, nullable: true }
        brand_subtitle: { type: string, nullable: true }
        notify_emails: { type: string, nullable: true, description: Comma-separated } 
        remind_before_expiry: { type: boolean }
    UploadLinkUpdate:
      type: object
      properties:
        name: { type: string, nullable: true }
        folder: { $ref: "#/components/schemas/Folder" }
        turbosort: { type: string, nullable: true }
        send_link: { type: boolean }
        password: { type: string, nullable: true }
        verify_email: { type: boolean }
        max_file_size: { type: integer, nullable: true }
        allowed_extensions: { type: array, items: { type: string }, nullable: true }
        uploader_fields_required:
          type: object
          properties:
            name: { type: boolean }
            email: { type: boolean }
            message: { type: boolean }
        subfolder_template: { type: string, nullable: true }
        brand_display_name: { type: string, nullable: true }
        brand_subtitle: { type: string, nullable: true }
        notify_emails: { type: string, nullable: true }
        remind_before_expiry: { type: boolean }
    UploadLink:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [upload] }
        name: { type: string }
        token: { type: string }
        public_url: { type: string, format: uri }
        state: { type: string, enum: [ok, expired, revoked] }
        folder: { $ref: "#/components/schemas/Folder" }
        turbosort: { type: string, nullable: true }
        send_link: { type: boolean, description: Whether Portal keeps a Send link on the Exports folder. }
        return_link:
          type: object
          nullable: true
          description: The Send link Portal keeps for the Exports folder (`folder.sync.exports`), for the client to download from; its settings follow this link.
          properties:
            id: { type: string, format: uuid }
            public_url: { type: string, format: uri }
        expires_at: { type: string, format: date-time, nullable: true }
        password_protected: { type: boolean }
        max_file_size: { type: integer, nullable: true }
        allowed_extensions: { type: array, items: { type: string }, nullable: true }
        uploader_fields_required:
          type: object
          properties:
            name: { type: boolean }
            email: { type: boolean }
            message: { type: boolean }
        verify_email: { type: boolean }
        target_folder_id: { type: string, nullable: true }
        target_folder_name: { type: string, nullable: true }
        subfolder_template: { type: string, nullable: true }
        brand_display_name: { type: string, nullable: true }
        brand_subtitle: { type: string, nullable: true }
        notify_emails: { type: array, items: { type: string }, nullable: true }
        remind_before_expiry: { type: boolean }
        revoked_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
