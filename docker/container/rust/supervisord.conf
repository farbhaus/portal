# Process model for the Rust all-in-one image: Postgres, Redis, the Rust service (API + static
# SPA), the sync worker, and Caddy. There is no Node or Python runtime.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /data/postgres -c listen_addresses=127.0.0.1
user=postgres
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:redis]
command=redis-server --appendonly yes --dir /data/redis --bind 127.0.0.1
user=redis
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:api]
command=/usr/local/bin/portal-start-api.sh
directory=/app
user=app
environment=HOME="/app",WEB_DIR="/app/web/build"
priority=20
startsecs=10
startretries=5
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
# Runs as root because it writes synced files to the host mount (may squash non-root uids).
command=/usr/local/bin/portal-start-worker.sh
directory=/app
user=root
environment=HOME="/app"
priority=20
startsecs=10
startretries=5
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
user=root
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
