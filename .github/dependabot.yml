version: 2
# Policy: minor + patch updates only. Major bumps (breaking changes) are ignored
# so a dependency upgrade can't silently break production — do those by hand.
# GitHub Actions are exempt: their majors are how security fixes ship, and a stale
# action major is what triggered this whole audit.
updates:
  # GitHub Actions — allow majors here (security fixes ship as new majors).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: [ "*" ]

  # Rust API deps (what the image ships) — Cargo.toml + Cargo.lock.
  - package-ecosystem: cargo
    directory: /apps/api-rs
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      rust:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # MCP server deps (mcp/, a separate crate with its own Cargo.lock; not in the image).
  - package-ecosystem: cargo
    directory: /mcp
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      mcp:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Python reference API deps — uv ecosystem reads pyproject.toml + uv.lock directly.
  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      python:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Frontend Node deps.
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      npm:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]

  # Base images in the all-in-one Dockerfile — pin to minor/patch (no major OS/runtime jumps).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
