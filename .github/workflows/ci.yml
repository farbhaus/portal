# Lint, type-check, test the backend and build + check the frontend.
# Backend uses uv with the committed uv.lock so CI matches the deployed image.
# The Rust API (apps/api-rs, what the image ships) gets clippy + tests on the toolchain the
# Dockerfile builds with, and a check that its schema files still match the Alembic migrations.
# The MCP server (mcp/, its own crate and lockfile, not in the image) gets clippy + tests too.
# The Python API (apps/api) stays as the reference implementation and where migrations are written.
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python reference API — lint, types & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16  # match the production database major version
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: portal
          POSTGRES_DB: portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=5
    env:
      DATABASE_URL: postgresql+asyncpg://portal:portal@localhost:5432/portal
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Install dependencies (locked, incl. dev group)
        working-directory: apps/api
        run: uv sync --frozen
      - name: Lint with ruff
        working-directory: apps/api
        run: uv run ruff check .
      - name: Type-check with mypy
        working-directory: apps/api
        run: uv run mypy src
      - name: Run tests
        working-directory: apps/api
        run: uv run pytest -q

  frontend:
    name: Frontend — build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Svelte check
        working-directory: apps/web
        run: npm run check

  rust:
    name: Rust API — clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (same toolchain as the Dockerfile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: clippy
      - name: Install OpenSSL headers (webauthn-rs links OpenSSL)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libssl-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rs
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  mcp:
    name: MCP server — clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (same toolchain as the API job)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  rust-schema:
    name: Rust API — schema files match Alembic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: Compare schema.sql and migrations/ with freshly migrated databases
        run: tools/rustify/schema_check.sh
