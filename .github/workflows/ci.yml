# Build + check the frontend; clippy + tests for the Rust API (apps/api-rs, what the image ships)
# on the toolchain the Dockerfile builds with, and a check that its schema files agree with each
# other. The MCP server (mcp/, its own crate and lockfile, not in the image) gets clippy + tests too.
name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend — build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Build
        working-directory: apps/web
        run: npm run build
      - name: Svelte check
        working-directory: apps/web
        run: npm run check

  rust:
    name: Rust API — clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api-rs
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (same toolchain as the Dockerfile)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: clippy
      - name: Install OpenSSL headers (webauthn-rs links OpenSSL)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends pkg-config libssl-dev
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/api-rs
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  mcp:
    name: MCP server — clippy & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust (same toolchain as the API job)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.98'
          components: clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mcp
      - name: Clippy (warnings are errors)
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked

  rust-schema:
    name: Rust API — migrations reproduce schema.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply baseline.sql + migrations/ to a fresh database and compare with schema.sql
        run: tools/schema_check.sh
