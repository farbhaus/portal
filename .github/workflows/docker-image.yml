name: Docker Image CI

# Builds the all-in-one farbhaus/portal image and smoke-tests it (boots on a fresh volume, serves
# the app, accepts a login). On branch pushes / PRs that's all. On a version tag (vX.Y.Z) it then
# PUSHES to Docker Hub and creates the matching GitHub Release.
#
# Publishing prerequisites (see the "Going public / publishing" checklist in CLAUDE.md), all inert
# until a v* tag is pushed:
#   - the farbhaus/portal repo exists on Docker Hub
#   - repo secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are set

permissions:
  contents: read

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker metadata (tags from the git ref)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: farbhaus/portal
          # latest=auto (the default) also tags :latest on a semver tag push.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Only on a version tag: log in so the build can push.
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the all-in-one image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: farbhaus/portal:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Boot it on a fresh volume and wait for the healthcheck, so an image that can't start (an
      # entrypoint or schema-migration bug) fails here instead of on someone's server.
      - name: Smoke test (fresh volume)
        run: |
          docker run -d --name portal-ci -p 127.0.0.1:18080:80 \
            -e BASE_URL=http://127.0.0.1:18080 -e ADMIN_EMAIL=ci@example.com \
            -e ADMIN_PASSWORD=ci-smoke-password -e SESSION_COOKIE_SECURE=false \
            --health-cmd "curl -fsS -o /dev/null http://127.0.0.1:8000/api/health" \
            --health-interval 3s --health-retries 40 \
            farbhaus/portal:ci
          status=starting
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' portal-ci)" = true ] || break
            status=$(docker inspect -f '{{.State.Health.Status}}' portal-ci)
            [ "$status" = healthy ] && break
            sleep 3
          done
          if [ "$status" != healthy ]; then docker logs portal-ci; exit 1; fi
          docker logs portal-ci 2>&1 | grep -q "migrate: empty database"
          curl -fsS -o /dev/null http://127.0.0.1:18080/login
          curl -fsS -H 'content-type: application/json' \
            -d '{"email":"ci@example.com","password":"ci-smoke-password"}' \
            http://127.0.0.1:18080/api/auth/login | grep -q '"totp_required":false'

      - name: Push the image (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  # Only on a version tag, once the image is on Docker Hub: publish the GitHub Release, with notes
  # generated from the PRs merged since the previous tag. A suffixed tag (v2.1.0-rc.1) becomes a
  # pre-release, just as it doesn't move the image's :latest. A release already made by hand is
  # left alone. Its own job so only this step holds a write token.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Create the GitHub Release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it as is."
            exit 0
          fi
          flags=()
          [[ "$TAG" == *-* ]] && flags+=(--prerelease)
          gh release create "$TAG" --verify-tag --generate-notes "${flags[@]}"
